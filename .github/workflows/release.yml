name: Release installers

# Builds, smoke-tests and publishes installers for a version tag (vX.Y.Z).
#
# Optional repository secrets (each feature is skipped when its secret is absent):
#   WINDOWS_CERT_PFX_BASE64, WINDOWS_CERT_PASSWORD   — Authenticode signing
#   MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD,
#   MACOS_SIGN_IDENTITY                               — macOS code signing
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD       — macOS notarization
#   UPDATE_SIGNING_KEY                                — Ed25519 signature of
#     SHA256SUMS (see scripts/update_signing.py); set UPDATE_PUBLIC_KEY in
#     backend/telegrab/services/updater.py to make clients require it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish, e.g. v1.0.8 (must match pyproject.toml)'
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag must be SemVer and match the project version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z version tag"; exit 1
          fi
          VERSION=$(grep -m1 -oP '(?<=^version = ")[^"]+' backend/pyproject.toml)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::pyproject.toml has v$VERSION but the tag is $TAG. Run scripts/bump_version.py first."; exit 1
          fi

  windows:
    name: Build Windows
    needs: validate
    runs-on: windows-latest
    env:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend (locked)
        working-directory: backend
        run: uv sync --frozen
      - name: Backend tests
        working-directory: backend
        run: uv run --frozen pytest tests/ -q
      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Build and smoke-test
        run: backend\.venv\Scripts\python.exe installer\build.py --clean --rebuild-frontend --portable

      - name: Sign executables
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object FullName -like '*x64*' | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
            dist-installer\telegrab\telegrab.exe dist-installer\telegrab.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SIGN_PFX=$pfx" | Out-File -Append $env:GITHUB_ENV

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\telegrab_setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign installer
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object FullName -like '*x64*' | Select-Object -First 1
          $setup = Get-ChildItem dist-installer\Telegrab-*-Setup.exe | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            /f $env:SIGN_PFX /p $env:WINDOWS_CERT_PASSWORD $setup.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item (Get-ChildItem dist-installer\Telegrab-*-Setup.exe | Select-Object -First 1) out\telegrab-windows-setup.exe
          Copy-Item dist-installer\telegrab.exe out\telegrab-windows-portable.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: telegrab-windows
          path: out/*
          retention-days: 30
          if-no-files-found: error

  macos:
    name: Build macOS
    needs: validate
    runs-on: macos-latest
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend (locked)
        working-directory: backend
        run: uv sync --frozen
      - name: Backend tests
        working-directory: backend
        run: uv run --frozen pytest tests/ -q
      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Build and smoke-test
        run: backend/.venv/bin/python installer/build.py --clean --rebuild-frontend

      - name: Code-sign app
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN"
          codesign --force --deep --options runtime --timestamp \
            --sign "$MACOS_SIGN_IDENTITY" dist-installer/telegrab.app

      - name: Package
        run: |
          mkdir -p out
          ditto -c -k --keepParent dist-installer/telegrab.app out/telegrab-macos.zip

      - name: Notarize
        if: env.MACOS_CERT_P12_BASE64 != '' && env.APPLE_ID != ''
        run: |
          xcrun notarytool submit out/telegrab-macos.zip --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple dist-installer/telegrab.app
          rm out/telegrab-macos.zip
          ditto -c -k --keepParent dist-installer/telegrab.app out/telegrab-macos.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: telegrab-macos
          path: out/*
          retention-days: 30
          if-no-files-found: error

  linux:
    name: Build Linux
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev libwebkit2gtk-4.1-dev

      - name: Install backend (locked)
        working-directory: backend
        run: uv sync --frozen
      - name: Backend tests
        working-directory: backend
        run: uv run --frozen pytest tests/ -q
      - name: Install frontend
        working-directory: frontend
        run: npm ci

      # Uses the same PyInstaller spec as the other platforms (hidden imports
      # for Telethon, cryptg and the GTK webview backend included).
      - name: Build and smoke-test
        run: backend/.venv/bin/python installer/build.py --clean --rebuild-frontend

      - name: Package
        run: |
          mkdir -p out
          tar -czf out/telegrab-linux.tar.gz -C dist-installer telegrab

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: telegrab-linux
          path: out/*
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        run: |
          uv run --with cryptography python scripts/update_signing.py sums release release/*
          {
            echo "## SHA-256 Checksums"
            echo
            # Clients up to v1.0.7 read the first "SHA256: <hex>" line and always
            # download the Windows setup, so keep that line first.
            echo "SHA256: $(grep ' telegrab-windows-setup.exe$' release/SHA256SUMS | cut -d' ' -f1)"
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } > release-notes.md

      - name: Sign checksums
        if: env.UPDATE_SIGNING_KEY != ''
        run: uv run --with cryptography python scripts/update_signing.py sign release/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          name: Telegrab ${{ env.TAG }}
          draft: false
          generate_release_notes: true
          body_path: release-notes.md
          append_body: true
          fail_on_unmatched_files: true
          files: |
            release/telegrab-windows-setup.exe
            release/telegrab-windows-portable.exe
            release/telegrab-macos.zip
            release/telegrab-linux.tar.gz
            release/SHA256SUMS
            ${{ env.UPDATE_SIGNING_KEY != '' && 'release/SHA256SUMS.sig' || '' }}
