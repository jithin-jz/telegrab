[project]
name = "telegrab"
version = "1.2.0"
description = "Fast, secure desktop cloud storage on top of Telegram."
requires-python = ">=3.11"
authors = [{ name = "Telegrab contributors" }]
license = { text = "MIT" }
dependencies = [
    "pywebview==5.3.2",
    "telethon==1.36.0",
    "aiofiles==24.1.0",
    "pystray==0.19.5",
    "Pillow==10.4.0",
    "cryptography==50.0.2",
    "cryptg==0.6.0",
    "python-socks[asyncio]==3.1.1",
    "pythonnet==3.0.4; sys_platform == 'win32'",
    "pyobjc-core==10.3.1; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa==10.3.1; sys_platform == 'darwin'",
    "pyobjc-framework-WebKit==10.3.1; sys_platform == 'darwin'",
]

[dependency-groups]
dev = [
    "pyinstaller==6.11.1",
    "ruff==0.9.9",
    "pytest==8.3.5",
    "pytest-asyncio==1.3.0",
]

[project.scripts]
telegrab = "telegrab.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["telegrab*"]

[tool.ruff]
line-length = 88
# Matches requires-python so lint suggestions never need a newer interpreter.
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RET", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests favour explicit, self-contained setup over production idioms.
"tests/**" = ["E402", "SIM105", "SIM117", "PTH", "B017", "T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
